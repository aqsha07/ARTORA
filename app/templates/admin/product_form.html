{% extends 'admin/layout.html' %}

{% block title %}{{ title }} | ARTORA Admin{% endblock %}

{% block content %}
<div class="container container-sm">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
    <div>
      <span class="section-eyebrow" style="color: var(--terracotta);">Curator Catalog</span>
      <h1 style="font-size: 2.2rem; margin-bottom: 0.25rem;">{{ title }}</h1>
    </div>
    <a href="{{ url_for('admin.products') }}" class="btn" style="background-color: var(--bg-ivory-light); border: 1px solid var(--border-ivory); color: var(--charcoal-900);">
      <i class="fa-solid fa-arrow-left"></i> Back to Products
    </a>
  </div>

  <div style="background-color: var(--bg-ivory-light); border: 1px solid var(--border-ivory); border-radius: var(--radius-xl); padding: 3rem; box-shadow: var(--shadow-sm);">
    <form method="POST">
      <div class="form-group">
        <label class="form-label" for="prodName">Product Title *</label>
        <input type="text" name="name" id="prodName" class="form-control" value="{{ product.name if product else '' }}" placeholder="e.g. Master Belgian Stretched Linen Canvas (16x20 in)" required />
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
        <div class="form-group">
          <label class="form-label" for="prodCategory">Category *</label>
          <select name="category_id" id="prodCategory" class="form-select" required>
            <option value="">Select Category</option>
            {% for cat in categories %}
              <option value="{{ cat.id }}" {% if product and product.category_id == cat.id %}selected{% endif %}>
                {{ cat.name }}
              </option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="prodBrand">Brand / Studio Maker</label>
          <input type="text" name="brand" id="prodBrand" class="form-control" value="{{ product.brand if product else 'ARTORA Studio' }}" />
        </div>

        <div class="form-group">
          <label class="form-label" for="prodPrice">Price (₹ INR) *</label>
          <input type="number" step="0.01" name="price" id="prodPrice" class="form-control" value="{{ product.price if product else '' }}" placeholder="1499.00" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="prodComparePrice">Original / Compare Price (₹ INR)</label>
          <input type="number" step="0.01" name="compare_at_price" id="prodComparePrice" class="form-control" value="{{ product.compare_at_price if product and product.compare_at_price else '' }}" placeholder="1899.00" />
        </div>

        <div class="form-group">
          <label class="form-label" for="prodStock">Stock Inventory Units *</label>
          <input type="number" name="stock_quantity" id="prodStock" class="form-control" value="{{ product.stock_quantity if product else '50' }}" required min="0" />
        </div>

        <div class="form-group">
          <label class="form-label" for="prodBadge">Curator Badge</label>
          <select name="badge" id="prodBadge" class="form-select">
            <option value="">None</option>
            <option value="Bestseller" {% if product and product.badge == 'Bestseller' %}selected{% endif %}>Bestseller</option>
            <option value="Artisan Choice" {% if product and product.badge == 'Artisan Choice' %}selected{% endif %}>Artisan Choice</option>
            <option value="New Arrival" {% if product and product.badge == 'New Arrival' %}selected{% endif %}>New Arrival</option>
            <option value="Limited Edition" {% if product and product.badge == 'Limited Edition' %}selected{% endif %}>Limited Edition</option>
            <option value="Studio Classic" {% if product and product.badge == 'Studio Classic' %}selected{% endif %}>Studio Classic</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="prodImageUrl">Primary Image URL (High-Res Unsplash or CDN) *</label>
        <input type="url" name="image_url" id="prodImageUrl" class="form-control" value="{{ product.primary_image_url if product else '' }}" placeholder="https://images.unsplash.com/photo-..." />
      </div>

      <div class="form-group">
        <label class="form-label" for="prodShortDesc">Short Summary (displayed on cards)</label>
        <input type="text" name="short_description" id="prodShortDesc" class="form-control" value="{{ product.short_description if product else '' }}" placeholder="100% unbleached Belgian linen with quadruple titanium gesso priming." />
      </div>

      <div class="form-group">
        <label class="form-label" for="prodDesc">Full Detailed Description *</label>
        <textarea name="description" id="prodDesc" class="form-control" rows="5" required placeholder="Describe the pigment composition, viscosity, archival ratings, and technique recommendations...">{{ product.description if product else '' }}</textarea>
      </div>

      <div class="form-group">
        <label class="form-label" for="prodSpecs">Technical Specifications (Format: Key: Value per line)</label>
        <textarea name="specifications" id="prodSpecs" class="form-control" rows="4" placeholder="Material: 100% Belgian Linen&#10;Size: 16 x 20 inches&#10;Priming: Acid-free Titanium Gesso (4 coats)">{{ product.specifications if product else '' }}</textarea>
      </div>

      <div style="display: flex; gap: 2rem; margin: 1.5rem 0; padding: 1rem 1.5rem; background-color: var(--bg-ivory-warm); border-radius: var(--radius-md);">
        <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
          <input type="checkbox" name="is_featured" {% if product and product.is_featured %}checked{% endif %} />
          <span style="font-weight: 600; font-size: 0.9rem;">Featured on Homepage</span>
        </label>

        <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
          <input type="checkbox" name="is_bestseller" {% if product and product.is_bestseller %}checked{% endif %} />
          <span style="font-weight: 600; font-size: 0.9rem;">Mark as Bestseller</span>
        </label>

        <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
          <input type="checkbox" name="is_active" {% if not product or product.is_active %}checked{% endif %} />
          <span style="font-weight: 600; font-size: 0.9rem;">Active / Available in Store</span>
        </label>
      </div>

      <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 2rem;">
        <a href="{{ url_for('admin.products') }}" class="btn" style="background-color: var(--bg-ivory-warm); border: 1px solid var(--border-ivory); color: var(--charcoal-800);">Cancel</a>
        <button type="submit" class="btn btn-terracotta btn-lg">
          <i class="fa-solid fa-floppy-disk"></i> Save Product Listing
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
