<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Curator Panel | ARTORA Admin{% endblock %}</title>

  <!-- Google Fonts: Playfair Display & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:ital,wght@0,400..700&display=swap" rel="stylesheet" />

  <!-- Font Awesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Theme Stylesheets -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/variables.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}" />
</head>
<body style="background-color: var(--bg-ivory);">
  <!-- Admin Top Navigation Bar -->
  <div class="admin-header-bar">
    <div class="container">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <div style="display: flex; align-items: center; gap: 2rem;">
          <a href="{{ url_for('main.index') }}" class="brand-logo">
            <div class="brand-symbol" style="width: 32px; height: 32px; font-size: 1rem;">A</div>
            <span class="brand-name" style="color: #FFF; font-size: 1.3rem;">ARTORA</span>
          </a>
          <span class="badge badge-terracotta" style="font-size: 0.72rem;">Curator Studio Admin</span>
        </div>

        <nav class="admin-nav-links">
          <a href="{{ url_for('admin.dashboard') }}" class="admin-nav-link {% if request.endpoint == 'admin.dashboard' %}active{% endif %}">
            <i class="fa-solid fa-chart-pie"></i> Dashboard
          </a>
          <a href="{{ url_for('admin.products') }}" class="admin-nav-link {% if request.endpoint in ['admin.products', 'admin.product_new', 'admin.product_edit'] %}active{% endif %}">
            <i class="fa-solid fa-paintbrush"></i> Products
          </a>
          <a href="{{ url_for('admin.categories') }}" class="admin-nav-link {% if request.endpoint == 'admin.categories' %}active{% endif %}">
            <i class="fa-solid fa-layer-group"></i> Categories
          </a>
          <a href="{{ url_for('admin.orders') }}" class="admin-nav-link {% if request.endpoint in ['admin.orders', 'admin.order_detail'] %}active{% endif %}">
            <i class="fa-solid fa-bag-shopping"></i> Orders
          </a>
          <a href="{{ url_for('main.index') }}" class="admin-nav-link" target="_blank">
            <i class="fa-solid fa-store"></i> View Store <i class="fa-solid fa-arrow-up-right-from-square" style="font-size: 0.75rem;"></i>
          </a>
          <a href="{{ url_for('auth.logout') }}" class="admin-nav-link" style="color: #F87171;">
            <i class="fa-solid fa-arrow-right-from-bracket"></i> Exit
          </a>
        </nav>
      </div>
    </div>
  </div>

  <!-- Flash Alerts -->
  <div class="flash-container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}">
            <span>{{ message }}</span>
            <button class="alert-close" onclick="this.parentElement.remove()"><i class="fa-solid fa-xmark"></i></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}
  </div>

  <main style="padding: 2.5rem 0 5rem;">
    {% block content %}{% endblock %}
  </main>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
