{% extends 'base.html' %}

{% block title %}Canvas Not Found (404) | ARTORA{% endblock %}

{% block content %}
<section class="section" style="padding: 7rem 0; text-align: center;">
  <div class="container container-sm">
    <div style="font-size: 5rem; font-family: var(--font-serif); font-weight: 700; color: var(--terracotta); line-height: 1; margin-bottom: 1rem;">
      404
    </div>
    <h1 style="font-size: 2.2rem; margin-bottom: 1rem;">This Canvas is Still Blank.</h1>

    </p>
    <div style="display: flex; gap: 1rem; justify-content: center;">
      <a href="{{ url_for('main.index') }}" class="btn btn-terracotta btn-lg">

      </a>
      <a href="{{ url_for('shop.catalog') }}" class="btn btn-lg" style="background-color: var(--bg-ivory-light); border: 1px solid var(--border-ivory); color: var(--charcoal-900);">
